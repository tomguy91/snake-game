<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SNAKE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Heebo:wght@400;700;800&display=swap');

:root, .theme-classic {
    --bg: #9bbc0f;
    --snake: #0f380f;
    --food: #0f380f;
    --grid-line: #8bac0f;
    --screen-border: #306230;
    --container-bg: #879942;
    --text: #0f380f;
    --bezel: #2b3a42;
    --brand-text: #a8cc0c;
    --overlay-bg: rgba(155, 188, 15, 0.9);
    --font: 'Courier New', Courier, monospace;
    --snake-radius: 0;
}

.theme-kids {
    --bg: #e8f5e9;
    --snake: #4caf50;
    --food: #ff5722;
    --grid-line: #c8e6c9;
    --screen-border: #4caf50;
    --container-bg: #ffe0b2;
    --text: #2e7d32;
    --bezel: #ff9800;
    --brand-text: #fff;
    --overlay-bg: rgba(255, 152, 0, 0.85);
    --font: 'Fredoka One', 'Comic Sans MS', cursive;
    --snake-radius: 4px;
}

.theme-spiderman {
    --bg: #0D1117;
    --snake: #CC1A1A;
    --food: #E8E8E8;
    --grid-line: #1a1a2e;
    --screen-border: #CC1A1A;
    --container-bg: #1a1a2e;
    --text: #FFFFFF;
    --bezel: #CC1A1A;
    --brand-text: #FFFFFF;
    --overlay-bg: rgba(13, 17, 23, 0.92);
    --font: 'Heebo', 'Arial', sans-serif;
    --snake-radius: 2px;
}

/* RTL overrides */
html[dir="rtl"] body {
    direction: rtl;
    font-family: var(--font-rtl, var(--font));
}

html[dir="rtl"] .header {
    flex-direction: row-reverse;
}

html[dir="rtl"] .leaderboard-entry {
    flex-direction: row-reverse;
}

/* Reset and base styles */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: var(--font);
    touch-action: manipulation;
    overscroll-behavior: none;
    transition: background-color 0.3s, font-family 0.3s;
}

/* Phone Bezel */
.phone-bezel {
    background-color: var(--bezel);
    border-radius: 40px;
    padding: 40px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
    transition: background-color 0.3s;
}

.brand {
    color: var(--brand-text);
    font-weight: bold;
    font-size: 24px;
    margin-bottom: 20px;
    letter-spacing: 2px;
    transition: color 0.3s;
}

/* Screen Area */
.screen-container {
    background-color: var(--container-bg);
    padding: 10px;
    border-radius: 10px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
    position: relative;
    transition: background-color 0.3s;
}

.screen {
    background-color: var(--bg);
    border: 2px solid var(--screen-border);
    position: relative;
    overflow: hidden;
    /* LCD glare effect */
    box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    transition: background-color 0.3s, border-color 0.3s;
}

.screen::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 100%);
    pointer-events: none;
}

.header {
    display: flex;
    justify-content: space-between;
    padding: 5px 10px;
    font-weight: bold;
    color: var(--text);
    background-color: var(--bg);
    border-bottom: 2px solid var(--text);
    transition: color 0.3s, background-color 0.3s, border-color 0.3s;
}

canvas {
    display: block;
    image-rendering: pixelated;
}

/* D-pad */
.controls {
    margin-top: 30px;
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 10px;
    justify-content: center;
}

.btn {
    background-color: #bdc3c7;
    border: none;
    border-radius: 50%;
    font-size: 24px;
    color: #2b3a42;
    box-shadow: 0 4px 0 #7f8c8d, 0 5px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
}

.btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #7f8c8d, 0 1px 2px rgba(0,0,0,0.3);
}

.btn-up { grid-column: 2; grid-row: 1; }
.btn-left { grid-column: 1; grid-row: 2; }
.btn-right { grid-column: 3; grid-row: 2; }
.btn-down { grid-column: 2; grid-row: 3; }

/* Overlay */
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: var(--overlay-bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    display: none;
    transition: background-color 0.3s;
}

.overlay.active {
    display: flex;
}

.game-over-text {
    font-size: 24px;
    font-weight: bold;
    color: var(--text);
    margin-bottom: 10px;
    text-align: center;
}

.restart-btn {
    background-color: var(--text);
    color: var(--bg);
    border: 2px solid var(--text);
    padding: 10px 20px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 15px;
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
}

/* Additional UI Elements */
.menu-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: var(--overlay-bg);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    z-index: 20;
    display: none;
    padding: 10px;
    overflow-y: auto;
}

.menu-overlay.active {
    display: flex;
}

.menu-title {
    font-size: 36px;
    font-weight: bold;
    color: var(--text);
    margin: 10px 0;
    text-align: center;
}

.menu-section {
    width: 100%;
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.menu-label {
    font-size: 14px;
    font-weight: bold;
    color: var(--text);
    margin-bottom: 5px;
}

.button-group {
    display: flex;
    gap: 5px;
}

.menu-btn {
    background-color: transparent;
    color: var(--text);
    border: 2px solid var(--text);
    padding: 5px 10px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    font-size: 14px;
}

.menu-btn.selected {
    background-color: var(--text);
    color: var(--bg);
}

.primary-btn {
    background-color: var(--text);
    color: var(--bg);
    border: 2px solid var(--text);
    padding: 10px 30px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    font-size: 20px;
    margin-bottom: 10px;
    width: 80%;
}

.secondary-btn {
    background-color: transparent;
    color: var(--text);
    border: 2px solid var(--text);
    padding: 8px 20px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    font-size: 16px;
    margin-bottom: 5px;
    width: 80%;
}

.leaderboard-list {
    width: 100%;
    max-height: 180px;
    overflow-y: auto;
    font-size: 12px;
    color: var(--text);
    margin-bottom: 10px;
    border: 1px solid var(--text);
    padding: 5px;
    background-color: var(--bg);
}

.leaderboard-entry {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
    border-bottom: 1px dashed var(--grid-line);
}

.name-input {
    background-color: var(--bg);
    color: var(--text);
    border: 2px solid var(--text);
    padding: 5px;
    font-family: inherit;
    font-weight: bold;
    margin-bottom: 10px;
    width: 80%;
    text-align: center;
}

.lang-indicator {
    font-size: 12px;
    opacity: 0.7;
    margin-left: 4px;
}

html[dir="rtl"] .lang-indicator {
    margin-left: 0;
    margin-right: 4px;
}

@media (max-height: 700px), (max-width: 400px) {
    .phone-bezel {
        padding: 20px 10px;
        border-radius: 20px;
    }
    .controls {
        margin-top: 15px;
        grid-template-columns: 50px 50px 50px;
        grid-template-rows: 50px 50px 50px;
        gap: 5px;
    }
    .btn {
        font-size: 20px;
    }
}
</style>
</head>
<body>

<div class="phone-bezel">
    <div class="brand" id="brandTitle">SNAKE</div>

    <div class="screen-container">
        <div class="screen" id="screen">
            <div class="header">
                <span id="scoreDisplay">Score: 0</span>
                <span id="highScoreDisplay">Hi: 0</span>
            </div>
            <canvas id="game"></canvas>

            <div class="overlay" id="overlay">
                <div class="game-over-text" id="gameOverText">GAME OVER</div>
                <div id="finalScore" style="color:var(--text); font-weight:bold; margin-bottom: 10px;">Score: 0</div>
                <div id="highScoreEntry" style="display: none; flex-direction: column; align-items: center; width: 100%;">
                    <input type="text" id="playerName" class="name-input" maxlength="12" placeholder="Your Name">
                    <button class="primary-btn" id="saveScoreBtn">SAVE SCORE</button>
                </div>
                <button class="primary-btn" id="restartBtn" style="display: none;">PLAY AGAIN</button>
                <button class="secondary-btn" id="menuBtn">MENU</button>
            </div>

            <div class="menu-overlay active" id="mainMenu">
                <div class="menu-title" id="menuTitle">SNAKE</div>

                <button class="primary-btn" id="playBtn">🎮 PLAY</button>
                <button class="secondary-btn" id="showLeaderboardBtn">🏆 LEADERBOARD</button>

                <div class="menu-section" style="margin-top: 15px;">
                    <div class="menu-label" id="themeLabel">🎨 Theme</div>
                    <div class="button-group" id="themeButtons">
                        <button class="menu-btn selected" data-theme="classic">Classic</button>
                        <button class="menu-btn" data-theme="kids">Kids</button>
                        <button class="menu-btn" data-theme="spiderman">🕷️ Spider-Man</button>
                    </div>
                </div>

                <div class="menu-section">
                    <div class="menu-label" id="gridLabel">⚙️ Grid Size</div>
                    <div class="button-group">
                        <button class="menu-btn" id="sizeSmallBtn">S</button>
                        <button class="menu-btn selected" id="sizeMedBtn">M</button>
                        <button class="menu-btn" id="sizeLargeBtn">L</button>
                    </div>
                </div>

                <div class="menu-section">
                    <div class="menu-label" id="speedLabel">⚡ Speed</div>
                    <div class="button-group">
                        <button class="menu-btn" id="speedSlowBtn">Slow</button>
                        <button class="menu-btn selected" id="speedNormBtn">Norm</button>
                        <button class="menu-btn" id="speedFastBtn">Fast</button>
                    </div>
                </div>

                <div class="menu-section">
                    <div class="menu-label" id="langLabel">🌐 Language</div>
                    <div class="button-group">
                        <button class="menu-btn selected" id="langEnBtn">EN</button>
                        <button class="menu-btn" id="langHeBtn">עב</button>
                    </div>
                </div>
            </div>

            <div class="menu-overlay" id="leaderboardScreen">
                <div class="menu-title" style="font-size: 24px;" id="lbTitle">🏆 TOP 10</div>
                <div class="leaderboard-list" id="leaderboardList">
                    <!-- Entries injected by JS -->
                </div>
                <button class="primary-btn" id="backToMenuBtn" style="margin-top: 10px; font-size: 16px; padding: 5px 20px;">BACK</button>
                <button class="secondary-btn" id="clearLeaderboardBtn" style="font-size: 12px; padding: 5px 10px; border-color: transparent; text-decoration: underline;">Clear Leaderboard</button>
            </div>

        </div>
    </div>

    <div class="controls" id="dpad">
        <button class="btn btn-up" id="btnUp">▲</button>
        <button class="btn btn-left" id="btnLeft">◀</button>
        <button class="btn btn-right" id="btnRight">▶</button>
        <button class="btn btn-down" id="btnDown">▼</button>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════
// THEME SYSTEM
// ═══════════════════════════════════════════════
const THEME_DEFS = {
    classic: {
        name: { en: 'Classic', he: 'קלאסי' },
        emoji: '',
        cssClass: '',
        headShape: 'square',
    },
    kids: {
        name: { en: 'Kids', he: 'ילדים' },
        emoji: '🧒',
        cssClass: 'theme-kids',
        headShape: 'rounded',
        drawSegment: function(ctx, seg, idx, snake, CS) {
            const x = seg.x * CS, y = seg.y * CS;
            if (idx === 0) {
                // Head: slightly bigger rounded rect with eyes
                ctx.fillStyle = getCSS('--snake');
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, CS - 2, CS - 2, 6);
                ctx.fill();
                // Eyes
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(x + CS*0.35, y + CS*0.35, CS*0.15, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + CS*0.65, y + CS*0.35, CS*0.15, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(x + CS*0.35, y + CS*0.35, CS*0.06, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + CS*0.65, y + CS*0.35, CS*0.06, 0, Math.PI*2);
                ctx.fill();
            } else {
                ctx.fillStyle = getCSS('--snake');
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, CS - 2, CS - 2, 5);
                ctx.fill();
            }
        },
        drawFood: function(ctx, food, CS) {
            ctx.font = `${CS - 2}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🍎', food.x * CS + CS/2, food.y * CS + CS/2 + 2);
        },
        drawBackground: function(ctx, gridSize, CS) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            for (let x = 0; x < gridSize; x++) {
                for (let y = 0; y < gridSize; y++) {
                    ctx.beginPath();
                    ctx.arc(x * CS + CS/2, y * CS + CS/2, 2, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }
    },
    spiderman: {
        name: { en: 'Spider-Man', he: 'ספיידרמן' },
        emoji: '🕷️',
        cssClass: 'theme-spiderman',
        headShape: 'mask',
        drawSegment: function(ctx, seg, idx, snake, CS) {
            const x = seg.x * CS, y = seg.y * CS;
            const cx = x + CS/2, cy = y + CS/2;
            const r = CS/2 - 1;
            const isHead = (idx === 0);
            const isBlue = (idx > 0 && idx % 4 === 0);

            if (isHead) {
                // ── SPIDER-MAN HEAD ──
                // Red mask background
                ctx.fillStyle = '#CC1A1A';
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, CS - 2, CS - 2, 4);
                ctx.fill();

                // Determine eye placement based on direction
                const dir = snake.length >= 2
                    ? { x: snake[0].x - snake[1].x, y: snake[0].y - snake[1].y }
                    : { x: 1, y: 0 };
                const faceRight = dir.x > 0 || (dir.x === 0 && dir.y !== 0);
                const facing = faceRight ? 1 : -1;

                // White almond eyes
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#111111';
                ctx.lineWidth = Math.max(0.5, CS * 0.04);

                // Left eye (from our perspective)
                const eyeCx = cx + facing * r * 0.2;
                ctx.beginPath();
                ctx.ellipse(eyeCx - r*0.35, cy - r*0.25, r*0.4, r*0.25, facing * 0.15, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();

                // Right eye
                ctx.beginPath();
                ctx.ellipse(eyeCx + r*0.35, cy - r*0.25, r*0.4, r*0.25, facing * 0.15, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();

                // Web lines on mask (very thin, only if big enough)
                if (CS >= 16) {
                    ctx.strokeStyle = '#111111';
                    ctx.lineWidth = 0.4;
                    // Center vertical web line
                    ctx.beginPath();
                    ctx.moveTo(cx, y + 2);
                    ctx.lineTo(cx, cy + r*0.2);
                    ctx.stroke();
                    // Horizontal web lines
                    for (let i = 0; i < 2; i++) {
                        const ly = y + 2 + i * (r * 0.8);
                        ctx.beginPath();
                        ctx.moveTo(x + 3, ly);
                        ctx.lineTo(x + CS - 3, ly);
                        ctx.stroke();
                    }
                    // Diagonal from center
                    ctx.beginPath();
                    ctx.moveTo(cx, cy + r*0.1);
                    ctx.lineTo(cx - r*0.5, y + r*0.3);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(cx, cy + r*0.1);
                    ctx.lineTo(cx + r*0.5, y + r*0.3);
                    ctx.stroke();
                }

            } else if (isBlue) {
                // ── BLUE BODY SEGMENT (Spidey costume sides) ──
                ctx.fillStyle = '#1A3C8E';
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, CS - 2, CS - 2, 3);
                ctx.fill();
                // Subtle highlight
                if (CS >= 14) {
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.fillRect(x + 2, y + 2, CS - 4, (CS - 4) * 0.4);
                }

            } else {
                // ── RED BODY SEGMENT with web pattern ──
                ctx.fillStyle = '#CC1A1A';
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, CS - 2, CS - 2, 3);
                ctx.fill();

                // Web pattern on red segments
                if (CS >= 12) {
                    ctx.strokeStyle = '#8B0000';
                    ctx.lineWidth = 0.4;
                    const pad = 3;
                    // Vertical
                    ctx.beginPath();
                    ctx.moveTo(cx, y + pad);
                    ctx.lineTo(cx, y + CS - pad);
                    ctx.stroke();
                    // Horizontal
                    ctx.beginPath();
                    ctx.moveTo(x + pad, cy);
                    ctx.lineTo(x + CS - pad, cy);
                    ctx.stroke();
                    // Diagonals (X pattern)
                    ctx.beginPath();
                    ctx.moveTo(x + pad, y + pad);
                    ctx.lineTo(x + CS - pad, y + CS - pad);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x + CS - pad, y + pad);
                    ctx.lineTo(x + pad, y + CS - pad);
                    ctx.stroke();
                }
            }
        },
        drawFood: function(ctx, food, CS) {
            const cx = food.x * CS + CS/2, cy = food.y * CS + CS/2;
            const r = CS/2 - 2;

            // Glowing web center
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath();
            ctx.arc(cx, cy, r + 2, 0, Math.PI*2);
            ctx.fill();

            // White web: spokes
            ctx.strokeStyle = '#E8E8E8';
            ctx.lineWidth = Math.max(1, CS * 0.08);
            const spokes = 8;
            for (let i = 0; i < spokes; i++) {
                const angle = (Math.PI * 2 / spokes) * i;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
                ctx.stroke();
            }

            // Concentric web rings
            ctx.lineWidth = Math.max(1, CS * 0.06);
            const rings = Math.max(2, Math.floor(r / 3));
            for (let i = 1; i <= rings; i++) {
                const rr = (r / rings) * i;
                ctx.beginPath();
                ctx.arc(cx, cy, rr, 0, Math.PI*2);
                ctx.stroke();
            }

            // Center dot
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(cx, cy, Math.max(1.5, CS * 0.1), 0, Math.PI*2);
            ctx.fill();
        },
        drawBackground: function(ctx, gridSize, CS) {
            // Subtle starfield effect on dark background
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            const starSeed = 42;
            for (let i = 0; i < gridSize * 1.5; i++) {
                const sx = ((i * 137 + starSeed) % (gridSize * 100)) / 100;
                const sy = ((i * 251 + starSeed * 3) % (gridSize * 100)) / 100;
                ctx.beginPath();
                ctx.arc(sx * CS, sy * CS, Math.max(0.5, CS * 0.04), 0, Math.PI*2);
                ctx.fill();
            }
        }
    }
};

function getCSS(varName) {
    return getComputedStyle(document.body).getPropertyValue(varName).trim() || '#000';
}

// ═══════════════════════════════════════════════
// LANGUAGE / i18n
// ═══════════════════════════════════════════════
const STR = {
    en: {
        title: 'SNAKE',
        play: '🎮 PLAY',
        leaderboard: '🏆 LEADERBOARD',
        themeLabel: '🎨 Theme',
        gridLabel: '⚙️ Grid Size',
        speedLabel: '⚡ Speed',
        slow: 'Slow',
        norm: 'Norm',
        fast: 'Fast',
        gameOver: 'GAME OVER',
        kidsGameOver: 'Oh no! Try again?',
        scorePrefix: 'Score: ',
        hiPrefix: 'Hi: ',
        finalScorePrefix: 'Score: ',
        yourName: 'Your Name',
        saveScore: 'SAVE SCORE',
        playAgain: 'PLAY AGAIN',
        menu: 'MENU',
        back: 'BACK',
        clearLB: 'Clear Leaderboard',
        noScores: 'No scores yet! Play a game.',
        top10: '🏆 TOP 10',
        confirmClear: 'Are you sure you want to clear the leaderboard?',
        langLabel: '🌐 Language',
    },
    he: {
        title: 'סנייק',
        play: '🎮 שחק',
        leaderboard: '🏆 טבלת שיאים',
        themeLabel: '🎨 ערכת נושא',
        gridLabel: '⚙️ גודל לוח',
        speedLabel: '⚡ מהירות',
        slow: 'איטי',
        norm: 'רגיל',
        fast: 'מהיר',
        gameOver: 'נגמר המשחק!',
        kidsGameOver: 'אוי לא! ננסה שוב?',
        scorePrefix: 'ניקוד: ',
        hiPrefix: 'שיא: ',
        finalScorePrefix: 'ניקוד: ',
        yourName: 'השם שלך',
        saveScore: 'שמור ניקוד',
        playAgain: 'שחק שוב',
        menu: 'תפריט',
        back: 'חזור',
        clearLB: 'נקה טבלה',
        noScores: 'אין תוצאות עדיין! שחק משחק.',
        top10: '🏆 טופ 10',
        confirmClear: 'בטוח שברצונך לנקות את טבלת השיאים?',
        langLabel: '🌐 שפה',
    }
};

// ═══════════════════════════════════════════════
// DOM REFS
// ═══════════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const highScoreDisplay = document.getElementById('highScoreDisplay');
const overlay = document.getElementById('overlay');
const finalScore = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');
const mainMenu = document.getElementById('mainMenu');
const leaderboardScreen = document.getElementById('leaderboardScreen');
const gameOverText = document.getElementById('gameOverText');
const highScoreEntry = document.getElementById('highScoreEntry');
const playerNameInput = document.getElementById('playerName');

let CELL_SIZE;

// ═══════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════
const state = {
    snake: [],
    direction: {x: 1, y: 0},
    nextDirection: {x: 1, y: 0},
    food: {x: 0, y: 0},
    score: 0,
    highScore: localStorage.getItem('snakeHighScore') || 0,
    gameOver: false,
    gameLoopId: null,

    // Configs
    theme: localStorage.getItem('snakeTheme') || 'classic',
    gridSize: parseInt(localStorage.getItem('snakeGridSize')) || 20,
    baseSpeed: parseInt(localStorage.getItem('snakeSpeed')) || 150,
    currentSpeed: 150,
    language: localStorage.getItem('snakeLanguage') || 'en',
};

highScoreDisplay.textContent = STR[state.language].hiPrefix + state.highScore;

// ═══════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════
function t(key) {
    return STR[state.language][key] || STR['en'][key] || key;
}

function themeName(themeKey) {
    const def = THEME_DEFS[themeKey];
    if (!def) return themeKey;
    return def.name[state.language] || def.name['en'] || themeKey;
}

function updateAllUI() {
    const lang = state.language;

    // Set RTL
    document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', lang === 'he' ? 'he' : 'en');

    // Update RTL font override for Hebrew
    if (lang === 'he') {
        document.documentElement.style.setProperty('--font-rtl', "'Heebo', 'Arial', sans-serif");
    } else {
        document.documentElement.style.setProperty('--font-rtl', '');
    }

    // Brand / menu title
    document.getElementById('brandTitle').textContent = t('title');
    document.getElementById('menuTitle').textContent = t('title');

    // Buttons
    document.getElementById('playBtn').textContent = t('play');
    document.getElementById('showLeaderboardBtn').textContent = t('leaderboard');
    document.getElementById('restartBtn').textContent = t('playAgain');
    document.getElementById('menuBtn').textContent = t('menu');
    document.getElementById('backToMenuBtn').textContent = t('back');
    document.getElementById('clearLeaderboardBtn').textContent = t('clearLB');
    document.getElementById('saveScoreBtn').textContent = t('saveScore');
    playerNameInput.placeholder = t('yourName');

    // Labels
    document.getElementById('themeLabel').textContent = t('themeLabel');
    document.getElementById('gridLabel').textContent = t('gridLabel');
    document.getElementById('speedLabel').textContent = t('speedLabel');
    document.getElementById('langLabel').textContent = t('langLabel');
    document.getElementById('lbTitle').textContent = t('top10');

    // Speed buttons
    document.getElementById('speedSlowBtn').textContent = t('slow');
    document.getElementById('speedNormBtn').textContent = t('norm');
    document.getElementById('speedFastBtn').textContent = t('fast');

    // Header
    scoreDisplay.textContent = t('scorePrefix') + state.score;
    highScoreDisplay.textContent = t('hiPrefix') + state.highScore;

    // Language buttons
    document.getElementById('langEnBtn').classList.toggle('selected', lang === 'en');
    document.getElementById('langHeBtn').classList.toggle('selected', lang === 'he');

    // Theme button labels
    document.querySelectorAll('#themeButtons .menu-btn').forEach(btn => {
        const themeKey = btn.dataset.theme;
        const def = THEME_DEFS[themeKey];
        if (def) {
            const emoji = def.emoji ? def.emoji + ' ' : '';
            btn.textContent = emoji + themeName(themeKey);
        }
    });
}

function setLanguage(lang) {
    state.language = lang;
    localStorage.setItem('snakeLanguage', lang);
    updateAllUI();
    updateLeaderboardUI();
    if (!state.gameOver && state.snake.length > 0) {
        scoreDisplay.textContent = t('scorePrefix') + state.score;
        highScoreDisplay.textContent = t('hiPrefix') + state.highScore;
    }
    draw();
}

// ═══════════════════════════════════════════════
// THEME LOGIC
// ═══════════════════════════════════════════════
function applyTheme(themeName) {
    state.theme = themeName;
    localStorage.setItem('snakeTheme', themeName);

    // Remove all theme classes
    document.body.classList.remove('theme-classic', 'theme-kids', 'theme-spiderman');

    // Apply new theme class
    const def = THEME_DEFS[themeName];
    if (def && def.cssClass) {
        document.body.classList.add(def.cssClass);
    }

    // Update theme buttons
    document.querySelectorAll('#themeButtons .menu-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.theme === themeName);
    });

    draw();
}

// ═══════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════
function resize() {
    const maxWidth = Math.min(window.innerWidth * 0.9, 400);
    CELL_SIZE = Math.floor(Math.min(maxWidth, window.innerHeight * 0.5) / state.gridSize);
    canvas.width = CELL_SIZE * state.gridSize;
    canvas.height = CELL_SIZE * state.gridSize;
    draw();
}

window.addEventListener('resize', resize);

function initGame() {
    mainMenu.classList.remove('active');
    leaderboardScreen.classList.remove('active');
    overlay.classList.remove('active');

    const centerX = Math.floor(state.gridSize / 2);
    const centerY = Math.floor(state.gridSize / 2);

    state.snake = [
        {x: centerX, y: centerY},
        {x: centerX - 1, y: centerY},
        {x: centerX - 2, y: centerY}
    ];
    state.direction = {x: 1, y: 0};
    state.nextDirection = {x: 1, y: 0};
    state.score = 0;
    state.gameOver = false;
    state.currentSpeed = state.baseSpeed;

    scoreDisplay.textContent = t('scorePrefix') + state.score;
    resize();
    spawnFood();

    if (state.gameLoopId) clearTimeout(state.gameLoopId);
    draw();
    scheduleNextTick();
}

function spawnFood() {
    let valid = false;
    while (!valid) {
        state.food = {
            x: Math.floor(Math.random() * state.gridSize),
            y: Math.floor(Math.random() * state.gridSize)
        };
        valid = !state.snake.some(segment => segment.x === state.food.x && segment.y === state.food.y);
    }
}

function scheduleNextTick() {
    state.gameLoopId = setTimeout(gameLoop, state.currentSpeed);
}

function gameLoop() {
    if (state.gameOver) return;

    update();
    draw();

    if (!state.gameOver) {
        scheduleNextTick();
    }
}

function update() {
    state.direction = state.nextDirection;
    const head = {
        x: state.snake[0].x + state.direction.x,
        y: state.snake[0].y + state.direction.y
    };

    if (checkCollision(head)) {
        endGame();
        return;
    }

    state.snake.unshift(head);

    if (head.x === state.food.x && head.y === state.food.y) {
        state.score += 10;
        scoreDisplay.textContent = t('scorePrefix') + state.score;
        state.currentSpeed = Math.max(70, state.baseSpeed - Math.floor(state.score / 50) * 5);
        if (state.score > state.highScore) {
            state.highScore = state.score;
            localStorage.setItem('snakeHighScore', state.highScore);
            highScoreDisplay.textContent = t('hiPrefix') + state.highScore;
        }
        spawnFood();
    } else {
        state.snake.pop();
    }
}

function checkCollision(head) {
    if (head.x < 0 || head.x >= state.gridSize || head.y < 0 || head.y >= state.gridSize) {
        return true;
    }
    return state.snake.some(segment => segment.x === head.x && segment.y === head.y);
}

// ═══════════════════════════════════════════════
// LEADERBOARD
// ═══════════════════════════════════════════════
function loadLeaderboard() {
    try {
        const data = localStorage.getItem('snakeLeaderboard');
        return data ? JSON.parse(data) : [];
    } catch (e) {
        return [];
    }
}

function saveToLeaderboard(name) {
    let board = loadLeaderboard();
    const entry = {
        name: name || 'Anonymous',
        score: state.score,
        theme: state.theme,
        difficulty: `Grid:${state.gridSize} Spd:${state.baseSpeed}`,
        date: new Date().toLocaleDateString()
    };
    board.push(entry);
    board.sort((a, b) => b.score - a.score);
    board = board.slice(0, 10);
    try {
        localStorage.setItem('snakeLeaderboard', JSON.stringify(board));
    } catch (e) {
        console.error("Could not save to localStorage", e);
    }
    updateLeaderboardUI();
}

function translateDifficulty(diffStr) {
    // diffStr is like "Grid:20 Spd:150"
    const parts = diffStr.split(' ');
    if (parts.length !== 2) return diffStr;
    const gridPart = parts[0]; // "Grid:20"
    const spdPart = parts[1];  // "Spd:150"
    const gridVal = gridPart.split(':')[1];
    const spdVal = spdPart.split(':')[1];
    const speedLabel = spdVal === '200' ? t('slow') : spdVal === '150' ? t('norm') : t('fast');
    return `${gridVal}×${gridVal} ${speedLabel}`;
}

function updateLeaderboardUI() {
    const list = document.getElementById('leaderboardList');
    const board = loadLeaderboard();
    list.innerHTML = '';

    if (board.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding: 20px 0;">${t('noScores')}</div>`;
        return;
    }

    board.forEach((entry, idx) => {
        const div = document.createElement('div');
        div.className = 'leaderboard-entry';
        const themeDisplay = themeName(entry.theme);
        const diffDisplay = entry.difficulty ? translateDifficulty(entry.difficulty) : '';
        div.innerHTML = `
            <span>#${idx + 1} <b>${entry.name}</b></span>
            <span style="text-align: ${state.language === 'he' ? 'left' : 'right'};">
                ${entry.score}pts<br>
                <small style="font-size: 9px;">${themeDisplay} | ${diffDisplay} | ${entry.date}</small>
            </span>
        `;
        list.appendChild(div);
    });
}

function isTop10(score) {
    if (score <= 0) return false;
    const board = loadLeaderboard();
    if (board.length < 10) return true;
    return score > board[board.length - 1].score;
}

// ═══════════════════════════════════════════════
// GAME END
// ═══════════════════════════════════════════════
function endGame() {
    state.gameOver = true;
    if (state.theme === 'kids') {
        gameOverText.textContent = t('kidsGameOver');
    } else {
        gameOverText.textContent = t('gameOver');
    }
    finalScore.textContent = t('finalScorePrefix') + state.score;

    if (isTop10(state.score)) {
        highScoreEntry.style.display = 'flex';
        restartBtn.style.display = 'none';
        playerNameInput.value = '';
        playerNameInput.focus();
    } else {
        highScoreEntry.style.display = 'none';
        restartBtn.style.display = 'block';
    }

    overlay.classList.add('active');
}

document.getElementById('saveScoreBtn').addEventListener('click', () => {
    let name = playerNameInput.value.trim().substring(0, 12);
    if (!name) {
        playerNameInput.style.borderColor = 'red';
        return;
    }
    playerNameInput.style.borderColor = 'var(--text)';
    saveToLeaderboard(name);
    highScoreEntry.style.display = 'none';
    restartBtn.style.display = 'block';
});

// ═══════════════════════════════════════════════
// DRAWING (theme-aware)
// ═══════════════════════════════════════════════
function draw() {
    const bgColor = getCSS('--bg');
    const def = THEME_DEFS[state.theme];

    // Clear canvas
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Theme-specific background
    if (def && def.drawBackground) {
        def.drawBackground(ctx, state.gridSize, CELL_SIZE);
    }

    // Draw snake
    state.snake.forEach((segment, idx) => {
        if (def && def.drawSegment) {
            def.drawSegment(ctx, segment, idx, state.snake, CELL_SIZE);
        } else {
            // Default rendering
            const snakeColor = getCSS('--snake');
            ctx.fillStyle = snakeColor;
            ctx.fillRect(segment.x * CELL_SIZE, segment.y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
        }
    });

    // Draw food (only if in valid position)
    if (state.food.x >= 0 && state.food.y >= 0) {
        if (def && def.drawFood) {
            def.drawFood(ctx, state.food, CELL_SIZE);
        } else {
            const foodColor = getCSS('--food');
            ctx.fillStyle = foodColor;
            ctx.fillRect(state.food.x * CELL_SIZE + 2, state.food.y * CELL_SIZE + 2, CELL_SIZE - 5, CELL_SIZE - 5);
        }
    }
}

// ═══════════════════════════════════════════════
// INPUT HANDLING
// ═══════════════════════════════════════════════
function setDirection(x, y) {
    if (state.direction.x !== -x || state.direction.y !== -y) {
        state.nextDirection = {x, y};
    }
}

window.addEventListener('keydown', e => {
    if (document.activeElement === playerNameInput) {
        return;
    }

    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
        e.preventDefault();
    }

    if (state.gameOver && e.code === 'Space' && highScoreEntry.style.display !== 'flex') {
        initGame();
        return;
    }

    switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); break;
        case 'ArrowDown': case 's': case 'S': setDirection(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); break;
    }
});

// Touch and D-pad
['touchstart', 'mousedown'].forEach(evt => {
    document.getElementById('btnUp').addEventListener(evt, e => { e.preventDefault(); setDirection(0, -1); });
    document.getElementById('btnDown').addEventListener(evt, e => { e.preventDefault(); setDirection(0, 1); });
    document.getElementById('btnLeft').addEventListener(evt, e => { e.preventDefault(); setDirection(-1, 0); });
    document.getElementById('btnRight').addEventListener(evt, e => { e.preventDefault(); setDirection(1, 0); });
});

restartBtn.addEventListener('click', initGame);
restartBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    initGame();
});

// Swipe detection
let startX = 0, startY = 0;
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
}, {passive: false});

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    if (!startX || !startY) return;

    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;
    let dx = endX - startX;
    let dy = endY - startY;

    if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0) setDirection(1, 0);
            else setDirection(-1, 0);
        } else {
            if (dy > 0) setDirection(0, 1);
            else setDirection(0, -1);
        }
    } else if (state.gameOver) {
        initGame();
    }

    startX = 0;
    startY = 0;
}, {passive: false});

// Visibility change to pause game
document.addEventListener("visibilitychange", () => {
    if (document.hidden && !state.gameOver) {
        if (state.gameLoopId) {
            clearTimeout(state.gameLoopId);
            state.gameLoopId = null;
        }
    } else if (!document.hidden && !state.gameOver && !state.gameLoopId) {
        scheduleNextTick();
    }
});

// ═══════════════════════════════════════════════
// MENU EVENT HANDLERS
// ═══════════════════════════════════════════════
function updateDifficultyUI() {
    document.getElementById('sizeSmallBtn').classList.toggle('selected', state.gridSize === 15);
    document.getElementById('sizeMedBtn').classList.toggle('selected', state.gridSize === 20);
    document.getElementById('sizeLargeBtn').classList.toggle('selected', state.gridSize === 25);

    document.getElementById('speedSlowBtn').classList.toggle('selected', state.baseSpeed === 200);
    document.getElementById('speedNormBtn').classList.toggle('selected', state.baseSpeed === 150);
    document.getElementById('speedFastBtn').classList.toggle('selected', state.baseSpeed === 100);
}

document.getElementById('playBtn').addEventListener('click', () => {
    initGame();
});

document.getElementById('menuBtn').addEventListener('click', () => {
    overlay.classList.remove('active');
    mainMenu.classList.add('active');
});

document.getElementById('showLeaderboardBtn').addEventListener('click', () => {
    updateLeaderboardUI();
    leaderboardScreen.classList.add('active');
    mainMenu.classList.remove('active');
});

document.getElementById('backToMenuBtn').addEventListener('click', () => {
    leaderboardScreen.classList.remove('active');
    mainMenu.classList.add('active');
});

document.getElementById('clearLeaderboardBtn').addEventListener('click', () => {
    if (confirm(t('confirmClear'))) {
        localStorage.removeItem('snakeLeaderboard');
        updateLeaderboardUI();
    }
});

// Theme buttons (data-driven)
document.querySelectorAll('#themeButtons .menu-btn').forEach(btn => {
    btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
});

// Grid size
function setGridSize(size) {
    state.gridSize = size;
    localStorage.setItem('snakeGridSize', size);
    updateDifficultyUI();
}
document.getElementById('sizeSmallBtn').addEventListener('click', () => setGridSize(15));
document.getElementById('sizeMedBtn').addEventListener('click', () => setGridSize(20));
document.getElementById('sizeLargeBtn').addEventListener('click', () => setGridSize(25));

// Speed
function setSpeed(speed) {
    state.baseSpeed = speed;
    localStorage.setItem('snakeSpeed', speed);
    updateDifficultyUI();
}
document.getElementById('speedSlowBtn').addEventListener('click', () => setSpeed(200));
document.getElementById('speedNormBtn').addEventListener('click', () => setSpeed(150));
document.getElementById('speedFastBtn').addEventListener('click', () => setSpeed(100));

// Language buttons
document.getElementById('langEnBtn').addEventListener('click', () => setLanguage('en'));
document.getElementById('langHeBtn').addEventListener('click', () => setLanguage('he'));

// ═══════════════════════════════════════════════
// INITIALIZATION
// ═══════════════════════════════════════════════
updateAllUI();
applyTheme(state.theme);
updateDifficultyUI();
updateLeaderboardUI();
resize();

// Don't auto-start — draw menu state background
const initialCenterX = Math.floor(state.gridSize / 2);
const initialCenterY = Math.floor(state.gridSize / 2);
state.snake = [
    {x: initialCenterX, y: initialCenterY},
    {x: initialCenterX - 1, y: initialCenterY},
    {x: initialCenterX - 2, y: initialCenterY}
];
state.food = { x: -1, y: -1 };
draw();

</script>
</body>
