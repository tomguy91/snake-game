<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SNAKE</title>
<style>
/* Reset and base styles */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    touch-action: manipulation;
    overscroll-behavior: none;
}

/* Phone Bezel */
.phone-bezel {
    background-color: #2b3a42;
    border-radius: 40px;
    padding: 40px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
}

.brand {
    color: #a8cc0c;
    font-weight: bold;
    font-size: 24px;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

/* Screen Area */
.screen-container {
    background-color: #879942; /* Darker border */
    padding: 10px;
    border-radius: 10px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
    position: relative;
}

.screen {
    background-color: #9bbc0f;
    border: 2px solid #306230;
    position: relative;
    overflow: hidden;
    /* LCD glare effect */
    box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
}

.screen::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 100%);
    pointer-events: none;
}

.header {
    display: flex;
    justify-content: space-between;
    padding: 5px 10px;
    font-weight: bold;
    color: #0f380f;
    background-color: #9bbc0f;
    border-bottom: 2px solid #0f380f;
}

canvas {
    display: block;
    image-rendering: pixelated;
}

/* D-pad */
.controls {
    margin-top: 30px;
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 10px;
    justify-content: center;
}

.btn {
    background-color: #bdc3c7;
    border: none;
    border-radius: 50%;
    font-size: 24px;
    color: #2b3a42;
    box-shadow: 0 4px 0 #7f8c8d, 0 5px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
}

.btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #7f8c8d, 0 1px 2px rgba(0,0,0,0.3);
}

.btn-up { grid-column: 2; grid-row: 1; }
.btn-left { grid-column: 1; grid-row: 2; }
.btn-right { grid-column: 3; grid-row: 2; }
.btn-down { grid-column: 2; grid-row: 3; }

/* Overlay */
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(155, 188, 15, 0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    display: none;
}

.overlay.active {
    display: flex;
}

.game-over-text {
    font-size: 24px;
    font-weight: bold;
    color: #0f380f;
    margin-bottom: 10px;
    text-align: center;
}

.restart-btn {
    background-color: #0f380f;
    color: #9bbc0f;
    border: 2px solid #0f380f;
    padding: 10px 20px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 15px;
}

/* Colors used:
   Lightest: #9bbc0f (Background)
   Light: #8bac0f
   Dark: #306230
   Darkest: #0f380f (Snake/Text)
*/

@media (max-height: 700px), (max-width: 400px) {
    .phone-bezel {
        padding: 20px 10px;
        border-radius: 20px;
    }
    .controls {
        margin-top: 15px;
        grid-template-columns: 50px 50px 50px;
        grid-template-rows: 50px 50px 50px;
        gap: 5px;
    }
    .btn {
        font-size: 20px;
    }
}
</style>
</head>
<body>

<div class="phone-bezel">
    <div class="brand">SNAKE</div>

    <div class="screen-container">
        <div class="screen" id="screen">
            <div class="header">
                <span id="scoreDisplay">Score: 0</span>
                <span id="highScoreDisplay">Hi: 0</span>
            </div>
            <canvas id="game"></canvas>

            <div class="overlay" id="overlay">
                <div class="game-over-text">GAME OVER</div>
                <div id="finalScore" style="color:#0f380f; font-weight:bold;">Score: 0</div>
                <button class="restart-btn" id="restartBtn">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <div class="controls" id="dpad">
        <button class="btn btn-up" id="btnUp">▲</button>
        <button class="btn btn-left" id="btnLeft">◀</button>
        <button class="btn btn-right" id="btnRight">▶</button>
        <button class="btn btn-down" id="btnDown">▼</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const highScoreDisplay = document.getElementById('highScoreDisplay');
const overlay = document.getElementById('overlay');
const finalScore = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');

// Game constants
const GRID_SIZE = 20;
let CELL_SIZE;

// Game State
const state = {
    snake: [],
    direction: {x: 1, y: 0},
    nextDirection: {x: 1, y: 0},
    food: {x: 0, y: 0},
    score: 0,
    highScore: localStorage.getItem('snakeHighScore') || 0,
    gameOver: false,
    gameLoopId: null,
    baseSpeed: 150,
    currentSpeed: 150
};

highScoreDisplay.textContent = 'Hi: ' + state.highScore;

function resize() {
    const maxWidth = Math.min(window.innerWidth * 0.9, 400);
    CELL_SIZE = Math.floor(Math.min(maxWidth, window.innerHeight * 0.5) / GRID_SIZE);
    canvas.width = CELL_SIZE * GRID_SIZE;
    canvas.height = CELL_SIZE * GRID_SIZE;
    draw();
}

window.addEventListener('resize', resize);

function initGame() {
    state.snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];
    state.direction = {x: 1, y: 0};
    state.nextDirection = {x: 1, y: 0};
    state.score = 0;
    state.gameOver = false;
    state.currentSpeed = state.baseSpeed;
    scoreDisplay.textContent = 'Score: ' + state.score;
    overlay.classList.remove('active');
    spawnFood();
    if (state.gameLoopId) clearTimeout(state.gameLoopId);
    draw();
    scheduleNextTick();
}

function spawnFood() {
    let valid = false;
    while (!valid) {
        state.food = {
            x: Math.floor(Math.random() * GRID_SIZE),
            y: Math.floor(Math.random() * GRID_SIZE)
        };
        valid = !state.snake.some(segment => segment.x === state.food.x && segment.y === state.food.y);
    }
}

function scheduleNextTick() {
    state.gameLoopId = setTimeout(gameLoop, state.currentSpeed);
}

function gameLoop() {
    if (state.gameOver) return;

    update();
    draw();

    if (!state.gameOver) {
        scheduleNextTick();
    }
}

function update() {
    state.direction = state.nextDirection;
    const head = {
        x: state.snake[0].x + state.direction.x,
        y: state.snake[0].y + state.direction.y
    };

    if (checkCollision(head)) {
        endGame();
        return;
    }

    state.snake.unshift(head);

    if (head.x === state.food.x && head.y === state.food.y) {
        state.score += 10;
        scoreDisplay.textContent = 'Score: ' + state.score;
        state.currentSpeed = Math.max(70, state.baseSpeed - Math.floor(state.score / 50) * 5);
        if (state.score > state.highScore) {
            state.highScore = state.score;
            localStorage.setItem('snakeHighScore', state.highScore);
            highScoreDisplay.textContent = 'Hi: ' + state.highScore;
        }
        spawnFood();
    } else {
        state.snake.pop();
    }
}

function checkCollision(head) {
    if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
        return true;
    }
    return state.snake.some(segment => segment.x === head.x && segment.y === head.y);
}

function endGame() {
    state.gameOver = true;
    finalScore.textContent = 'Score: ' + state.score;
    overlay.classList.add('active');
}

function draw() {
    // Clear canvas
    ctx.fillStyle = '#9bbc0f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw snake
    ctx.fillStyle = '#0f380f';
    state.snake.forEach(segment => {
        ctx.fillRect(segment.x * CELL_SIZE, segment.y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
    });

    // Draw food
    ctx.fillStyle = '#0f380f';
    ctx.fillRect(state.food.x * CELL_SIZE + 2, state.food.y * CELL_SIZE + 2, CELL_SIZE - 5, CELL_SIZE - 5);
}

// Input handling
function setDirection(x, y) {
    if (state.direction.x !== -x || state.direction.y !== -y) {
        state.nextDirection = {x, y};
    }
}

window.addEventListener('keydown', e => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
        e.preventDefault();
    }

    if (state.gameOver && e.code === 'Space') {
        initGame();
        return;
    }

    switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
            setDirection(0, -1);
            break;
        case 'ArrowDown':
        case 's':
        case 'S':
            setDirection(0, 1);
            break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
            setDirection(-1, 0);
            break;
        case 'ArrowRight':
        case 'd':
        case 'D':
            setDirection(1, 0);
            break;
    }
});

// Touch and D-pad
['touchstart', 'mousedown'].forEach(evt => {
    document.getElementById('btnUp').addEventListener(evt, e => { e.preventDefault(); setDirection(0, -1); });
    document.getElementById('btnDown').addEventListener(evt, e => { e.preventDefault(); setDirection(0, 1); });
    document.getElementById('btnLeft').addEventListener(evt, e => { e.preventDefault(); setDirection(-1, 0); });
    document.getElementById('btnRight').addEventListener(evt, e => { e.preventDefault(); setDirection(1, 0); });
});

restartBtn.addEventListener('click', initGame);
restartBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    initGame();
});

// Swipe detection
let startX = 0;
let startY = 0;

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
}, {passive: false});

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    if (!startX || !startY) return;

    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;

    let dx = endX - startX;
    let dy = endY - startY;

    if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0) setDirection(1, 0);
            else setDirection(-1, 0);
        } else {
            if (dy > 0) setDirection(0, 1);
            else setDirection(0, -1);
        }
    } else if (state.gameOver) {
        initGame();
    }

    startX = 0;
    startY = 0;
}, {passive: false});

// Visibility change to pause game
document.addEventListener("visibilitychange", () => {
    if (document.hidden && !state.gameOver) {
        if (state.gameLoopId) {
            clearTimeout(state.gameLoopId);
            state.gameLoopId = null;
        }
    } else if (!document.hidden && !state.gameOver && !state.gameLoopId) {
        scheduleNextTick();
    }
});

// Initialize
resize();
initGame();

</script>
</body>
</html>
